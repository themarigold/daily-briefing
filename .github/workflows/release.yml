name: Release

# Tag-triggered: builds the four target binaries with bun's cross-compiler, checksums them, and
# attaches everything to a GitHub Release. Windows binary is published but labeled experimental
# (compiles and is unit-tested nowhere; see README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Gate (typecheck + tests)
        run: |
          bunx tsc --noEmit
          bun test
      - name: Version must match tag
        run: |
          set -euo pipefail
          PKG=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) != tag ($TAG) — the shipped binary would report the wrong version" >&2
            exit 1
          fi
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --target="bun-$t" --outfile "dist/daily-briefing-$t" src/main.ts
          done
          bun build --compile --target=bun-windows-x64 --outfile dist/daily-briefing-windows-x64.exe src/main.ts
      - name: Checksums
        run: |
          cd dist && sha256sum daily-briefing-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/daily-briefing-* dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "Prebuilt binaries (darwin-arm64 / darwin-x64 / linux-x64 / linux-arm64; windows-x64 experimental). Verify with SHA256SUMS. Source install: see README."
